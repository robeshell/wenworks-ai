name: Setup
description: 装好 Node、两个 Next.js 部分（models、tools）和管理后台（admin）的依赖。首页和 Agent 导航没有依赖。
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: |
          sites/models/package-lock.json
          sites/tools/package-lock.json
          admin/package-lock.json
    - name: Install
      shell: bash
      run: |
        npm ci --prefix sites/models
        npm ci --prefix sites/tools
        npm ci --prefix admin
