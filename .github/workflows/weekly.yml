name: Weekly issue

# 每周一 08:17（Asia/Taipei）汇总上一周的动态，提交回仓库并发布整个站。
# 手动触发时可以选"只预览"（不提交也不发布），也可以指定要生成哪一周。
on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:
    inputs:
      preview:
        description: 只预览，不提交也不发布
        type: boolean
        default: false
      week:
        description: 要生成哪一周：填这一周里任意一天（YYYY-MM-DD）。留空是上一个完整的周
        type: string
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Keep hot-topic translations between runs
        uses: actions/cache@v4
        with:
          path: sites/home/.cache
          key: hot-translations-${{ github.run_id }}
          restore-keys: hot-translations-

      - name: Collect this week's issue and build the whole site
        env:
          WEEK: ${{ inputs.week }}
          PRODUCTION: ${{ inputs.preview == true && '0' || '1' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$WEEK" ]; then
            node scripts/build-all.mjs --hot --collect "--week=$WEEK"
          else
            node scripts/build-all.mjs --hot --collect
          fi
      - name: Commit the issue
        if: inputs.preview != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sites/home/data/issues sites/home/state
          if git diff --staged --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "chore: weekly issue"
            git pull --rebase origin main
            git push
          fi
      - name: Upload preview
        if: inputs.preview == true
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          include-hidden-files: true
      - name: Upload Pages artifact
        if: inputs.preview != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: inputs.preview != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
