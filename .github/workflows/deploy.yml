name: Deploy site

# 把四个部分构建成一个站，发布到 GitHub Pages（ai.wenworks.app）。
# - 合并到 main 之后
# - 两个数据任务提交了新数据之后（它们用仓库自带的令牌推送，不会触发 push 事件）
# - 每天四次定时重新发布，刷新首页的热点（Hacker News、GitHub 的公开数据，不提交进仓库）
# - 推送到其他分支时只构建、不发布，产物在这次运行的 Artifacts 里
on:
  push:
  schedule:
    - cron: "43 3,9,15,21 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh model data", "Update agent docs index"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') }}

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup

      - name: Test and lint
        run: npm run check

      - name: Keep hot-topic translations between runs
        uses: actions/cache@v4
        with:
          path: sites/home/.cache
          key: hot-translations-${{ github.run_id }}
          restore-keys: hot-translations-

      - name: Build the whole site
        env:
          PRODUCTION: ${{ env.PUBLISH == 'true' && '1' || '0' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-all.mjs --hot

      - name: Upload preview
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: dist
          include-hidden-files: true

      - name: Upload Pages artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
