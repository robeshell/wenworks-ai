name: Deploy admin

# 管理后台（admin/）部署到 Cloudflare Workers：admin.wenworks.app。
# - admin/ 有改动并合并到 main 之后
# - 需要仓库 Secrets：CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID。没配好时只检查、不部署。
on:
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/admin.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=Admin not deployed::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository secrets to deploy the admin."; fi
      - name: Apply database migrations
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler d1 migrations apply wenworks-admin --remote
      - name: Import the catalog on first deploy
        if: steps.creds.outputs.ok == 'true'
        run: node scripts/seed-if-empty.mjs
      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy
