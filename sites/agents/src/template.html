<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Claude Code、Codex、Antigravity CLI、Grok 的官方文档导航：学习路线、快速上手、功能对照。非官方整理。">
<link rel="alternate" type="application/rss+xml" title="Wenworks AI · Agent 导航 · 文档变化" href="/agents/feed.xml">
<title>Wenworks AI · Agent 导航</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Wenworks AI 共用视觉规范，见 design/wenworks-ai-design.md。
   黑白灰加一个橙色；直角；1px 线分隔；不用渐变、模糊、发光。 */
:root{color-scheme:light;--bg:#ffffff;--ink:#171717;--mute:#525252;--seen:#737373;--soft:#f5f5f5;--softer:#fafafa;--line:#e5e5e5;--line2:#d4d4d4;--accent:#ec5b13;--sans:"IBM Plex Sans",ui-sans-serif,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--ease:cubic-bezier(0.22,1,0.36,1);--header-height:3.5rem}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:calc(var(--header-height) + 1rem)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@keyframes site-header-in{from{opacity:0;transform:translateY(-0.35rem)}to{opacity:1;transform:translateY(0)}}
@keyframes site-content-in{from{opacity:0}to{opacity:1}}
.site-header{animation:site-header-in 360ms var(--ease) both}
.site-header a{text-decoration:none}
.enter>*{animation:site-content-in 460ms var(--ease) 60ms both}

/* ---- Wenworks AI 共用页头 ----
   这一段由 shared/site-header.css 同步而来，不要在这里改。
   改 shared/site-header.css，然后运行 node scripts/sync-shared.mjs。 */
.site-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: #ffffff;
  border-bottom: 1px solid #e5e5e5;
}

.site-header-inner {
  display: flex;
  align-items: center;
  height: 3.5rem;
  max-width: 72rem;
  margin: 0 auto;
  padding: 0 1.5rem;
}

.site-brand {
  flex: none;
  margin-right: 1rem;
  color: #171717;
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  text-decoration: none;
  white-space: nowrap;
  transition: opacity 180ms ease;
}

.site-brand:hover {
  opacity: 0.7;
}

.site-switch,
.site-nav {
  display: flex;
  align-items: center;
}

.site-switch {
  flex: none;
}

.site-nav {
  flex: 1 1 auto;
  min-width: 0;
}

.site-nav-end {
  display: flex;
  align-items: center;
  margin-left: auto;
}

.site-sep {
  flex: none;
  width: 1px;
  height: 1.25rem;
  margin: 0 0.75rem;
  background: #e5e5e5;
}

.site-header nav a {
  position: relative;
  display: inline-flex;
  flex: none;
  align-items: center;
  height: 2.75rem;
  padding: 0 0.75rem;
  color: #525252;
  font-size: 0.875rem;
  text-decoration: none;
  white-space: nowrap;
  transition: color 180ms ease, transform 180ms ease;
}

.site-header nav a::after {
  position: absolute;
  right: 0.75rem;
  bottom: 0.55rem;
  left: 0.75rem;
  height: 1px;
  background: currentColor;
  content: "";
  transform: scaleX(0);
  transform-origin: right;
  transition: transform 180ms ease;
}

.site-header nav a:hover {
  color: #171717;
  transform: translateY(-1px);
}

.site-header nav a[aria-current="page"] {
  color: #171717;
  font-weight: 500;
}

.site-header nav a:hover::after,
.site-header nav a[aria-current="page"]::after {
  transform: scaleX(1);
  transform-origin: left;
}

.site-menu-button {
  display: none;
  flex: none;
  align-items: center;
  height: 2.75rem;
  margin-left: auto;
  padding: 0 0.75rem;
  border: 1px solid #e5e5e5;
  border-radius: 0;
  background: #ffffff;
  color: #171717;
  font: inherit;
  font-size: 0.875rem;
  white-space: nowrap;
  cursor: pointer;
  transition: border-color 180ms ease, background-color 180ms ease;
}

.site-menu-button:hover {
  border-color: #d4d4d4;
  background: #f5f5f5;
}

@media (max-width: 52rem) {
  .site-header-inner {
    padding: 0 1rem;
  }

  .site-brand {
    margin-right: 0.5rem;
  }

  /* 三个站点入口始终显示；屏幕再窄时可以横向滑动。 */
  .site-switch {
    flex: 0 1 auto;
    min-width: 0;
    margin-right: 0.5rem;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .site-switch::-webkit-scrollbar {
    display: none;
  }

  .site-header .site-switch a {
    padding: 0 0.5rem;
  }

  .site-header .site-switch a::after {
    right: 0.5rem;
    left: 0.5rem;
  }

  .site-sep {
    display: none;
  }

  .site-menu-button {
    display: inline-flex;
  }

  .site-nav {
    position: absolute;
    top: 100%;
    right: 0;
    left: 0;
    display: none;
    flex-direction: column;
    align-items: stretch;
    padding: 0.5rem 1rem;
    border-bottom: 1px solid #e5e5e5;
    background: #ffffff;
    box-shadow: 0 8px 24px rgb(0 0 0 / 6%);
  }

  .site-nav[data-open="true"] {
    display: flex;
  }

  .site-nav-end {
    margin-left: 0;
    border-top: 1px solid #e5e5e5;
  }

  .site-header .site-nav a {
    justify-content: flex-start;
    padding: 0;
  }

  .site-header .site-nav a::after {
    display: none;
  }

  .site-header .site-nav a:hover {
    transform: none;
  }

  .site-header .site-nav > a + a {
    border-top: 1px solid #e5e5e5;
  }
}

@media (max-width: 25rem) {
  .site-brand {
    margin-right: 0.25rem;
  }

  .site-switch {
    margin-right: 0.25rem;
  }

  .site-header .site-switch a {
    padding: 0 0.375rem;
  }

  .site-header .site-switch a::after {
    right: 0.375rem;
    left: 0.375rem;
  }

  .site-menu-button {
    padding: 0 0.5rem;
  }
}
/* ---- 共用页头结束 ---- */

/* ---- 页面 ---- */
.band{max-width:72rem;margin:0 auto;padding:2rem 1rem}
@media(min-width:40rem){.band{padding:2.5rem 1.5rem}}
.phead{margin-bottom:1.5rem}
h1{font-size:1.5rem;font-weight:500;line-height:1.25;letter-spacing:-0.025em;margin:0 0 .25rem;text-wrap:balance}
@media(min-width:40rem){h1{font-size:1.75rem}}
.lede{color:var(--mute);font-size:.875rem;margin:0;max-width:62ch}
.stat{display:none}
.bar{height:3px;background:var(--line);overflow:hidden;margin-top:.5rem}
.bar i{display:block;height:100%;background:var(--accent);transition:width 360ms var(--ease)}
.note{color:var(--mute);font-size:.875rem;margin:1rem 0 0}
.note a{text-underline-offset:3px}
.hint{color:var(--mute);font-size:.875rem;margin:1rem 0 0;max-width:60ch}
.empty{color:var(--mute);padding:3rem 0;text-align:center}
.prose{max-width:62ch}.prose p{margin:0 0 1rem}.prose a{text-underline-offset:3px}
.subhead{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin:2rem 0 1rem}
.subhead h2{font-size:1.125rem;font-weight:500;line-height:1.3;margin:0}
.foot{color:var(--mute);font-size:.875rem;border-top:1px solid var(--line);margin:3rem 0 0;padding-top:1rem}
.foot a{text-underline-offset:3px}

/* 选择 agent、视图切换、搜索 */
.agents{display:flex;gap:.5rem;overflow-x:auto;padding:2px 2px .5rem;margin:0 -2px}
.agents button{flex:none;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:.5rem 1rem;min-height:2.75rem;cursor:pointer;transition:border-color 180ms ease,background-color 180ms ease,transform 180ms ease}
.agents button b{display:block;font-size:.9375rem;font-weight:500;line-height:1.3}
.agents button small{display:block;color:var(--mute);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.75rem}
.agents button:not(:disabled):hover{border-color:var(--line2);background:var(--soft);transform:translateY(-1px)}
.agents button{position:relative}
.agents button[aria-pressed=true]{border-color:var(--ink)}
.agents button[aria-pressed=true]::before{content:"";position:absolute;top:-1px;right:-1px;left:-1px;height:2px;background:var(--accent)}
.agents button:disabled{cursor:default;color:var(--mute);background:var(--softer)}
.tools{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;margin-top:1rem}
.seg{display:inline-flex;gap:.25rem;border-bottom:1px solid var(--line)}
.seg button{font:inherit;font-size:.875rem;color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:0 .75rem;min-height:2.75rem;cursor:pointer;white-space:nowrap;transition:color 180ms ease,border-color 180ms ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{border-bottom-color:var(--ink);color:var(--ink);font-weight:500}
.search{flex:1 1 15rem;position:relative}
.search input{width:100%;height:2.75rem;font:inherit;font-size:.875rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:0 .875rem 0 2.5rem;transition:border-color 180ms ease;-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--mute)}
.search input:hover{border-color:var(--line2)}
.search input:focus{outline:none;border-color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.search svg{position:absolute;left:.875rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;stroke:var(--mute)}
.reset{font:inherit;font-size:.875rem;color:var(--mute);background:none;border:0;cursor:pointer;min-height:2.75rem;padding:0 .25rem;text-decoration:underline;text-underline-offset:3px}
.reset:hover{color:var(--ink)}

/* 卡片 */
.stage,.card{background:var(--bg);border:1px solid var(--line);border-radius:0}
.stage{padding:1.5rem 1.5rem 1rem;display:flex;flex-direction:column}
.card{padding:1rem 1rem .25rem}
.stage .n{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:500;line-height:1.2}
.stage h3{font-size:1.125rem;font-weight:500;line-height:1.3;margin:.25rem 0}
.stage p{color:var(--mute);font-size:.875rem;margin:0 0 .5rem}
.stage .meta{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.75rem;color:var(--mute);display:flex;justify-content:space-between;margin-bottom:.25rem}
.meta b,.ahead b{font-weight:inherit}
.card h4{font-size:.875rem;font-weight:500;line-height:1.3;color:var(--mute);margin:0 0 .25rem}
.card h5{font-size:.8125rem;font-weight:500;color:var(--mute);margin:.5rem 0 0;padding-top:.5rem;border-top:1px solid var(--line)}
.ahead{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.75rem}
.ahead h3{font-size:1.125rem;font-weight:500;line-height:1.3;margin:0}
.ahead span{color:var(--mute);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8125rem;white-space:nowrap}
.ahead a{text-underline-offset:3px}

/* 链接列表 */
ul.pages,.plain{list-style:none;padding:0;margin:0}
.stage ul.pages,.plain{margin-top:.5rem}
.pages li{display:flex;align-items:flex-start;gap:.5rem;border-top:1px solid var(--line)}
.pages li:first-child{border-top:0}
.plain li{border-top:1px solid var(--line)}
.pages a,.plain a{flex:1;display:block;text-decoration:none;padding:.625rem 0;font-size:.9375rem;line-height:1.4;transition:color 180ms ease}
.pages a:hover,.plain a:hover{text-decoration:underline;text-underline-offset:3px}
.pages .tag,.plain .tag{display:block;font-size:.8125rem;color:var(--mute);margin-top:.125rem}
.pages .lab,.plain .lab{display:block;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.75rem;color:var(--mute);margin-bottom:.125rem}
.pages li.seen a,.pages li.seen .tag{color:var(--seen)}
.pages li.done a{color:var(--seen);text-decoration:line-through;text-decoration-color:var(--line2)}
.badge{flex:none;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.75rem;color:var(--mute);border:1px solid var(--line);padding:0 .375rem;margin-top:.625rem;white-space:nowrap}
.chk{flex:none;width:2.25rem;height:2.5rem;background:none;border:0;cursor:pointer;display:grid;place-items:center;padding:0}
.chk span{width:1.125rem;height:1.125rem;border:1px solid var(--line2);background:var(--bg);display:grid;place-items:center;transition:background-color 180ms ease,border-color 180ms ease}
.chk:hover span{border-color:var(--ink)}
li.done .chk span{background:var(--accent);border-color:var(--accent)}
.chk svg{width:.75rem;height:.75rem}
.chk path{fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:square;stroke-dasharray:11;stroke-dashoffset:11}
li.done .chk path{stroke-dashoffset:0}
li.just .chk path{transition:stroke-dashoffset 180ms ease-out}

/* 首页 */
.hgrid{display:grid;grid-template-columns:1fr;gap:1rem;align-items:start}
.hside{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
.big>p{margin:0 0 .5rem}
.big .arows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 3rem}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.25rem 1rem;align-items:center;border-top:1px solid var(--line);padding:1rem 0}
.arow b{font-size:1rem;font-weight:500}
.arow .meta{display:block;margin:.125rem 0 0}
.pill{display:inline-flex;align-items:center;min-height:2.75rem;padding:0 1rem;border:1px solid var(--ink);border-radius:0;background:var(--ink);color:#ffffff;font:inherit;font-size:.875rem;white-space:nowrap;cursor:pointer;transition:background-color 180ms ease,transform 180ms ease}
.pill:hover{background:#404040;transform:translateY(-1px)}
.quick{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:0 1.25rem;font-size:.875rem}
.quick a{color:var(--mute);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px;padding:.375rem 0;transition:color 180ms ease}
.quick a:hover{color:var(--ink);text-decoration-color:currentColor}
button.entry{text-align:left;cursor:pointer;color:var(--ink);font:inherit;justify-content:flex-start;transition:border-color 180ms ease,background-color 180ms ease,transform 180ms ease}
button.entry:hover{border-color:var(--line2);background:var(--softer);transform:translateY(-1px)}
.entry h3{margin:0 0 .25rem;font-size:1rem}
.entry p{margin:0}
.entry .arr{margin-top:auto;padding-top:1rem;font-size:.875rem;color:var(--mute)}
.entry:hover .arr{color:var(--ink)}
.alinks{display:flex;gap:.5rem;margin-top:.5rem;padding-top:1rem;border-top:1px solid var(--line)}
.alinks button{font:inherit;font-size:.875rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;min-height:2.75rem;padding:0 1rem;cursor:pointer;white-space:nowrap;transition:border-color 180ms ease,background-color 180ms ease,transform 180ms ease}
.alinks button:hover{border-color:var(--line2);background:var(--soft);transform:translateY(-1px)}

/* 学习路线、完整目录 */
/* 学习路线：每个阶段一段，左边是阶段说明，右边每篇一行（标题 + 一句话说明） */
.route{border-bottom:1px solid var(--line)}
.route .stage{display:grid;grid-template-columns:15rem minmax(0,1fr);column-gap:3rem;align-content:start;border:0;border-top:1px solid var(--line);padding:1.5rem 0}
.route .stage>*{grid-column:1}
.route .stage>ul.pages{grid-column:2;grid-row:1/span 5;margin:0}
.route .pages a{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);column-gap:1.5rem;align-items:baseline}
.route .pages .tag{margin:0}
@media(max-width:800px){.route .stage{display:flex;padding:1.5rem 0 .5rem}.route .stage>ul.pages{margin-top:.5rem}.route .pages a{display:block}.route .pages .tag{margin-top:.125rem}}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr));gap:1rem;align-items:start}
.chips{display:flex;gap:.5rem;overflow-x:auto;padding:2px 2px 1rem;margin:0 -2px}
.chips a{flex:none;display:inline-flex;align-items:center;min-height:2.75rem;padding:0 .875rem;border:1px solid var(--line);background:var(--bg);color:var(--mute);font-size:.875rem;text-decoration:none;white-space:nowrap;transition:border-color 180ms ease,color 180ms ease,transform 180ms ease}
.chips a:hover{color:var(--ink);border-color:var(--line2);transform:translateY(-1px)}
.chips small{color:var(--mute);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.75rem;margin-left:.375rem}
@media(min-width:700px){.chips{flex-wrap:wrap;overflow:visible}}
section.sec{margin:1.5rem 0 .5rem}
section.sec h2{font-size:1.125rem;font-weight:500;line-height:1.3;margin:0 0 1rem;display:flex;align-items:baseline;gap:.75rem}
section.sec h2 small{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.8125rem;font-weight:400;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,18rem),1fr));gap:1rem;align-items:start}

/* 对照表 */
.tw{overflow-x:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table.cmp{width:100%;border-collapse:collapse;font-size:.875rem;line-height:1.4}
.tw table.cmp{min-width:55rem}
.cmp th,.cmp td{text-align:left;padding:.75rem 1rem .75rem 0;border-top:1px solid var(--line);vertical-align:top}
.cmp thead th{border-top:0;color:var(--mute);font-weight:500}
.cmp tbody tr{transition:background-color 180ms ease}
@media(hover:hover){.cmp tbody tr:hover{background:var(--soft)}}
.cmp td:first-child{font-weight:500;width:22%}
.cmp a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:4px}
.cmp a:hover{text-decoration-color:currentColor}
.cmp code{display:block;margin-top:.125rem;font-family:var(--mono);font-size:.8125rem;color:var(--mute)}
.cmp td.none{color:var(--mute)}

@media(max-width:900px){.hside{grid-template-columns:repeat(2,minmax(0,1fr))}.big .arows{grid-template-columns:1fr}}
@media(max-width:600px){.stage{padding:1rem 1rem .75rem}.tw{overflow:visible}.tw table.cmp{min-width:0}
.stack thead{display:none}.stack tr{display:grid;padding-block:.5rem;border-top:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:.25rem 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute);font-weight:400}.stack td:first-child{width:auto}}
@media(max-width:480px){.hside{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.site-header nav a:hover,.agents button:hover,.pill:hover,button.entry:hover,.alinks button:hover,.chips a:hover{transform:none!important}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a href="/" class="site-brand">Wenworks AI</a>
    <nav class="site-switch" aria-label="Wenworks AI 站点"><a href="/models/">模型</a><a href="/agents/" aria-current="page">Agent 导航</a><a href="/tools/">工具精选</a></nav>
    <span class="site-sep" aria-hidden="true"></span>
    <nav id="top" class="site-nav" aria-label="本站栏目" data-open="false"></nav>
    <button type="button" class="site-menu-button" id="menu" aria-expanded="false" aria-controls="top">菜单</button>
  </div>
</header>
<div class="band"><div class="wrap">
<div class="phead">
  <div>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="stat" id="stat"><b id="pct">0%</b><span id="cnt">已读 0 / 0</span><div class="bar"><i id="bar" style="width:0"></i></div></div>
</div>
<nav class="agents" id="agents" aria-label="选择 agent"></nav>
<div class="tools" id="tools">
  <div class="seg" id="seg" role="group" aria-label="视图">
    <button data-m="start">快速上手</button>
    <button data-m="path">学习路线</button>
    <button data-m="all">完整目录</button>
  </div>

  q.placeholder=docs?`搜索 ${A.name} 文档，例如 hooks、权限、MCP`:'筛选功能，例如 MCP、hooks';
  out.innerHTML=view==='home'?renderHome():view==='articles'?renderArticles():view==='compare'?(term?'':`<div class="subhead" style="margin-top:6px"><h2>基本情况</h2></div>${renderPick()}<div class="subhead"><h2>价格</h2></div>${renderPick(PRICE)}<p class="hint" style="margin-top:12px">美元价格，2026-11-26 按各家官方定价页核对，不含税。各家的用量上限差别很大，这里没有列；价格随时可能变，以官方页面为准。</p><div class="subhead"><h2>功能对照</h2></div>`)+renderCmp(term):view==='updates'?renderUpdates():view==='about'?renderAbout():term?renderSearch(cur,term):mode==='start'?renderStart(cur):mode==='path'?renderPath(cur):renderAll(cur);
  document.title=view==='home'?SITE:view==='docs'?`Wenworks AI · ${A.name} 文档导航与学习路线`:`Wenworks AI · ${TITLE[view]}`;
  out.classList.toggle('enter',!!anim);
}
function go(v,m,a){view=v;if(a&&AGENTS[a]){cur=a;try{localStorage.setItem('docs-agent',a)}catch(e){}}if(m){mode=m;try{localStorage.setItem('docs-mode',m)}catch(e){}}q.value='';
  if(WEB)try{const p=pathOf();if(location.pathname!==p)history.pushState(null,'',p)}catch(e){}
  render(true);window.scrollTo(0,0)}
window.addEventListener('popstate',()=>{fromLocation();q.value='';render(true)});
const plain=e=>!(e.metaKey||e.ctrlKey||e.shiftKey||e.altKey||e.button);
$('top').addEventListener('click',e=>{const b=e.target.closest('a[data-v]');if(b&&plain(e)){e.preventDefault();go(b.dataset.v)}});
menuB.addEventListener('click',()=>setMenu($('top').dataset.open!=='true'));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
$('agents').addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(b)go('docs',null,b.dataset.a)});
seg.addEventListener('click',e=>{const b=e.target.closest('button[data-m]');if(b)go('docs',b.dataset.m)});
q.addEventListener('input',()=>render());
out.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go,g.dataset.m,g.dataset.a);return}
  const c=e.target.closest('[data-sec]');if(c){e.preventDefault();$('sec-'+c.dataset.sec).scrollIntoView({block:'start'});return}
  const b=e.target.closest('.chk');
  if(!b){seen(e);return}
  const l=b.closest('li'),id=l.dataset.a,s=l.dataset.s,D=sd(id);
  if(D[s])delete D[s];else D[s]=1;try{localStorage.setItem('start-done-v1',JSON.stringify(SD))}catch(e){}
  const on=!!D[s];l.classList.toggle('done',on);l.classList.add('just');b.setAttribute('aria-pressed',on);
  const st=l.closest('.stage');
  if(st){const all=st.querySelectorAll('.pages li').length,d=st.querySelectorAll('.pages li.done').length;
    const dn=st.querySelector('.dn'),bi=st.querySelector('.bar i');if(dn)dn.textContent=d;if(bi)bi.style.width=d/all*100+'%'}
});
function seen(e){const a=e.target.closest('.pages a');if(!a)return;const l=a.closest('li');if(!l)return;
  const A=AGENTS[l.dataset.a];A.read[l.dataset.s]=1;save(A);if(!l.dataset.c)l.classList.add('seen')}
out.addEventListener('auxclick',seen);
resetB.addEventListener('click',()=>{
  const b=resetB,A=AGENTS[cur];
  if(b.dataset.arm){A.read={};save(A);delete b.dataset.arm;b.textContent='清除看过的标记';render();return}
  b.dataset.arm='1';b.textContent=`再点一次，清除 ${A.name} 的标记`;
  setTimeout(()=>{if(b.dataset.arm){delete b.dataset.arm;b.textContent='清除看过的标记'}},3000);
});
render(true);
fetch(WEB?BASE+'/updates.json':'updates.json').then(r=>r.ok?r.json():null).then(j=>{if(Array.isArray(j)){UPD=j;if(view==='updates')render()}}).catch(()=>{});
fetch(WEB?BASE+'/articles.json':'articles.json').then(r=>r.ok?r.json():null).then(j=>{if(Array.isArray(j)){ART=j;if(view==='articles')render()}}).catch(()=>{});
}
</script>
</body>
</html>
